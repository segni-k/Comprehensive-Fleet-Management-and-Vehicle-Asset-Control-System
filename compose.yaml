name: oromia-fleet

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: oromia_fleet
      MYSQL_USER: oromia_fleet
      MYSQL_PASSWORD: local-development-only
      MYSQL_ROOT_PASSWORD: local-root-only
    ports: ["3306:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "localhost", "-plocal-root-only"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["1025:1025", "8025:8025"]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: local-minio
      MINIO_ROOT_PASSWORD: local-minio-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]

  clamav:
    image: clamav/clamav:1.4
    ports: ["3310:3310"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api/Dockerfile
    env_file: apps/api/.env
    ports: ["8080:8080"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: php artisan serve --host=0.0.0.0 --port=8080
    volumes:
      - ./apps/api:/workspace/apps/api
      - api-vendor:/workspace/apps/api/vendor

  queue:
    build:
      context: .
      dockerfile: infrastructure/docker/api/Dockerfile
    env_file: apps/api/.env
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: php artisan queue:work --tries=3 --timeout=90
    volumes:
      - ./apps/api:/workspace/apps/api
      - api-vendor:/workspace/apps/api/vendor

  scheduler:
    build:
      context: .
      dockerfile: infrastructure/docker/api/Dockerfile
    env_file: apps/api/.env
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: php artisan schedule:work
    volumes:
      - ./apps/api:/workspace/apps/api
      - api-vendor:/workspace/apps/api/vendor

  admin-web:
    build:
      context: .
      dockerfile: infrastructure/docker/admin-web/Dockerfile
      target: development
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
    ports: ["3000:3000"]
    volumes:
      - .:/workspace
      - root-node-modules:/workspace/node_modules
    command: npm run web:dev

volumes:
  mysql-data:
  redis-data:
  minio-data:
  api-vendor:
  root-node-modules:
